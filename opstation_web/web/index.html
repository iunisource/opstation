<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Opstation ERP">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Opstation">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Opstation</title>
  <link rel="manifest" href="manifest.json">

  <!-- Instant loading screen shown until Flutter paints its first frame, so a
       refresh shows branded progress instead of a blank white page. -->
  <style>
    #app-loading{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:rgba(15,27,61,0.5);
      backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      transition:opacity .35s ease;color:#fff}
    #app-loading .logo{width:58px;height:58px;border-radius:15px;background:#2F6FED;display:flex;
      align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#fff;
      box-shadow:0 8px 30px rgba(47,111,237,.45);margin-bottom:16px}
    #app-loading .name{font-size:18px;font-weight:700;letter-spacing:.2px}
    #app-loading .spin{margin-top:20px;width:26px;height:26px;border:3px solid rgba(255,255,255,.25);
      border-top-color:#fff;border-radius:50%;animation:opsspin .45s linear infinite}
    #app-loading .txt{margin-top:12px;font-size:12.5px;opacity:.65}
    @keyframes opsspin{to{transform:rotate(360deg)}}
  </style>

  <!-- The Flutter app service worker (offline-first) is intentionally kept:
       it downloads a whole build atomically and serves it from cache, which
       is what makes new tabs open instantly. The earlier "Deferred library
       not loaded" errors were caused by the hosting catch-all rewrite serving
       index.html for missing chunks (fixed in firebase.json), not by the SW.
       Do NOT add code here that unregisters it or wipes its caches — that
       forces a full re-download on every page load. -->

  <!-- ── Web Push helpers (native JS; called from Dart) ───────────────────── -->
  <script>
    (function () {
      function urlB64ToUint8(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var b64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(b64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
      }

      async function getActiveReg() {
        var reg = await navigator.serviceWorker.register('/push/push_sw.js', { scope: '/push/' });
        for (var i = 0; i < 50 && !(reg && reg.active); i++) {
          await new Promise(function (r) { setTimeout(r, 100); });
          reg = (await navigator.serviceWorker.getRegistration('/push/')) || reg;
        }
        return reg;
      }

      // Register early so the worker is active by the time the user toggles.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/push/push_sw.js', { scope: '/push/' })
          .catch(function (e) { console.warn('push sw register failed', e); });
      }

      window.opstationPushSupported = function () {
        return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
      };

      window.opstationPushStatus = async function () {
        try {
          if (!window.opstationPushSupported()) return false;
          var reg = await navigator.serviceWorker.getRegistration('/push/');
          if (!reg) return false;
          var sub = await reg.pushManager.getSubscription();
          return !!sub;
        } catch (e) { return false; }
      };

      window.opstationPushSubscribe = async function (vapidPublic) {
        if (!window.opstationPushSupported()) throw 'unsupported';
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') throw 'denied';
        var reg = await getActiveReg();
        var sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8(vapidPublic)
          });
        }
        var j = sub.toJSON();
        return JSON.stringify({
          endpoint: sub.endpoint,
          p256dh: j.keys.p256dh,
          auth: j.keys.auth
        });
      };

      window.opstationPushUnsubscribe = async function () {
        try {
          var reg = await navigator.serviceWorker.getRegistration('/push/');
          var sub = reg && await reg.pushManager.getSubscription();
          if (sub) { var ep = sub.endpoint; await sub.unsubscribe(); return ep; }
        } catch (e) {}
        return '';
      };
    })();
  </script>
<!-- opstation:splash-white -->
<style>
  html, body { background: #ffffff !important; background-color: #ffffff !important; }
</style>
<script>
  (function () {
    function whiten() {
      var all = document.body ? document.body.getElementsByTagName('*') : [];
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length === 0 && /loading your workspace/i.test(el.textContent || '')) {
          var n = el;
          while (n && n !== document.body) {
            var bg = getComputedStyle(n).backgroundColor;
            if (bg && bg !== 'rgba(0, 0, 0, 0)' && bg !== 'transparent') n.style.backgroundColor = '#ffffff';
            n = n.parentElement;
          }
        }
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', whiten);
    else whiten();
  })();
</script>
<!-- /opstation:splash-white -->
<!-- opstation:splash-throb -->
<style>
  /* Bigger, stronger, faster glow: two stacked shadows — a tight bright halo
     and a wide soft bloom — pulsing about once a second. */
  @keyframes opstThrob {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(47, 111, 237, 0.30)) drop-shadow(0 6px 18px rgba(47, 111, 237, 0.20)); }
    50%      { filter: drop-shadow(0 0 22px rgba(47, 111, 237, 0.95)) drop-shadow(0 14px 60px rgba(47, 111, 237, 0.75)); }
  }
  .opst-throb {
    animation: opstThrob 0.9s ease-in-out infinite !important;
    transform: none !important;
    will-change: filter;
  }
  @media (prefers-reduced-motion: reduce) {
    .opst-throb { animation: none !important; filter: drop-shadow(0 0 18px rgba(47, 111, 237, 0.7)) drop-shadow(0 12px 44px rgba(47, 111, 237, 0.5)); }
  }
</style>
<script>
  (function () {
    var tries = 0;
    function isLogo(el) {
      if (!el || el.nodeType !== 1) return false;
      var t = el.tagName.toLowerCase();
      if (t === 'img' || t === 'svg' || t === 'picture' || t === 'canvas') return true;
      var bg = getComputedStyle(el).backgroundImage;
      return bg && bg !== 'none' && el.children.length === 0;
    }
    function findLogo() {
      var body = document.body;
      if (!body) return null;
      // 1) The splash container = the element holding "Loading your workspace".
      var all = body.getElementsByTagName('*');
      for (var i = 0; i < all.length; i++) {
        var el = all[i];
        if (el.children.length === 0 && /loading your workspace/i.test(el.textContent || '')) {
          var box = el.parentElement;
          for (var up = 0; box && box !== body && up < 4; up++, box = box.parentElement) {
            var cands = box.querySelectorAll('img, svg, picture, canvas, [class*="logo" i], [id*="logo" i]');
            for (var j = 0; j < cands.length; j++) if (cands[j] !== el) return cands[j];
            // No image: the logo is a styled element (e.g. a coloured tile) —
            // take the first sibling block that isn't the loading text.
            for (var k = 0; k < box.children.length; k++) {
              var c = box.children[k];
              if (!c.contains(el) && c.tagName.toLowerCase() !== 'script' && c.getBoundingClientRect().width > 0) return c;
            }
          }
        }
      }
      // 2) Anything named like a logo.
      var named = body.querySelector('[class*="logo" i], [id*="logo" i], img[alt*="opstation" i], img[src*="logo" i]');
      if (named) return named;
      // 3) First image on the page before Flutter mounts.
      if (!document.querySelector('flutter-view, flt-glass-pane')) {
        var img = body.querySelector('img, svg');
        if (img && isLogo(img)) return img;
      }
      return null;
    }
    function apply() {
      var logo = findLogo();
      if (logo) {
        // Stop any animation on the logo's own wrapper too (logo must stay still).
        var p = logo.parentElement;
        if (p && p !== document.body) { p.style.animation = 'none'; p.style.transform = 'none'; }
        logo.classList.add('opst-throb');
        return true;
      }
      return false;
    }
    function run() {
      if (apply()) return;
      if (++tries < 40) setTimeout(run, 50); // splash may be injected a moment later
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
    else run();
  })();
</script>
<!-- /opstation:splash-throb -->
</head>
<body>
  <div id="app-loading">
    <div class="logo">O</div>
    <div class="name">Opstation</div>
    <div class="spin"></div>
    <div class="txt">Loading your workspace…</div>
  </div>
  <script>
    // Remove the loader the moment Flutter renders its first frame.
    (function () {
      function hide() {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
      }
      window.addEventListener('flutter-first-frame', hide);
      // Safety net: never let the loader stick for more than 30s.
      setTimeout(hide, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
