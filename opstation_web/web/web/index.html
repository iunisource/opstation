<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Opstation ERP">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Opstation">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Opstation</title>
  <link rel="manifest" href="manifest.json">

  <!-- Instant loading screen shown until Flutter paints its first frame, so a
       refresh shows branded progress instead of a blank white page. -->
  <style>
    #app-loading{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;
      align-items:center;justify-content:center;background:rgba(15,27,61,0.18);
      backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      transition:opacity .35s ease;color:#fff}
    #app-loading .logo{width:58px;height:58px;border-radius:15px;background:#2F6FED;display:flex;
      align-items:center;justify-content:center;font-weight:800;font-size:30px;color:#fff;
      box-shadow:0 8px 30px rgba(47,111,237,.45);margin-bottom:16px}
    #app-loading .name{font-size:18px;font-weight:700;letter-spacing:.2px}
    #app-loading .spin{margin-top:20px;width:26px;height:26px;border:3px solid rgba(255,255,255,.25);
      border-top-color:#fff;border-radius:50%;animation:opsspin .45s linear infinite}
    #app-loading .txt{margin-top:12px;font-size:12.5px;opacity:.65}
    @keyframes opsspin{to{transform:rotate(360deg)}}
  </style>

  <!-- The Flutter app service worker (offline-first) is intentionally kept:
       it downloads a whole build atomically and serves it from cache, which
       is what makes new tabs open instantly. The earlier "Deferred library
       not loaded" errors were caused by the hosting catch-all rewrite serving
       index.html for missing chunks (fixed in firebase.json), not by the SW.
       Do NOT add code here that unregisters it or wipes its caches — that
       forces a full re-download on every page load. -->

  <!-- ── Web Push helpers (native JS; called from Dart) ───────────────────── -->
  <script>
    (function () {
      function urlB64ToUint8(base64String) {
        var padding = '='.repeat((4 - base64String.length % 4) % 4);
        var b64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var raw = atob(b64);
        var arr = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        return arr;
      }

      async function getActiveReg() {
        var reg = await navigator.serviceWorker.register('/push/push_sw.js', { scope: '/push/' });
        for (var i = 0; i < 50 && !(reg && reg.active); i++) {
          await new Promise(function (r) { setTimeout(r, 100); });
          reg = (await navigator.serviceWorker.getRegistration('/push/')) || reg;
        }
        return reg;
      }

      // Register early so the worker is active by the time the user toggles.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/push/push_sw.js', { scope: '/push/' })
          .catch(function (e) { console.warn('push sw register failed', e); });
      }

      window.opstationPushSupported = function () {
        return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
      };

      window.opstationPushStatus = async function () {
        try {
          if (!window.opstationPushSupported()) return false;
          var reg = await navigator.serviceWorker.getRegistration('/push/');
          if (!reg) return false;
          var sub = await reg.pushManager.getSubscription();
          return !!sub;
        } catch (e) { return false; }
      };

      window.opstationPushSubscribe = async function (vapidPublic) {
        if (!window.opstationPushSupported()) throw 'unsupported';
        var perm = await Notification.requestPermission();
        if (perm !== 'granted') throw 'denied';
        var reg = await getActiveReg();
        var sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlB64ToUint8(vapidPublic)
          });
        }
        var j = sub.toJSON();
        return JSON.stringify({
          endpoint: sub.endpoint,
          p256dh: j.keys.p256dh,
          auth: j.keys.auth
        });
      };

      window.opstationPushUnsubscribe = async function () {
        try {
          var reg = await navigator.serviceWorker.getRegistration('/push/');
          var sub = reg && await reg.pushManager.getSubscription();
          if (sub) { var ep = sub.endpoint; await sub.unsubscribe(); return ep; }
        } catch (e) {}
        return '';
      };
    })();
  </script>
</head>
<body>
  <div id="app-loading">
    <div class="logo">O</div>
    <div class="name">Opstation</div>
    <div class="spin"></div>
    <div class="txt">Loading your workspace…</div>
  </div>
  <script>
    // Remove the loader the moment Flutter renders its first frame.
    (function () {
      function hide() {
        var el = document.getElementById('app-loading');
        if (!el) return;
        el.style.opacity = '0';
        setTimeout(function () { if (el && el.parentNode) el.parentNode.removeChild(el); }, 350);
      }
      window.addEventListener('flutter-first-frame', hide);
      // Safety net: never let the loader stick for more than 30s.
      setTimeout(hide, 30000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
