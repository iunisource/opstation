name: Opstation
description: Opstation — multi-tenant field operations and delivery management app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.0
  dio: ^5.4.3+1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  collection: ^1.18.0

  # Slice 3a — persistence + audio
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  audioplayers: ^6.0.0
  image_picker: ^1.1.2
  image: ^4.5.4

  # Slice 3b — sync, connectivity, real GPS
  connectivity_plus: ^6.0.3
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Slice 4 — customer management (map picker)
  google_maps_flutter: ^2.6.1

  # Slice 4.1 — plus code + URL launching (dialer, maps)
  url_launcher: ^6.3.0
  open_location_code: ^1.0.1

  # Slice 5b — password hashing (SHA-256)
  crypto: ^3.0.3

  # Slice 7 — PDF generation + preview + share
  pdf: ^3.13.0
  printing: ^5.15.0

  # Slice 8 — OSRM road distances + Nominatim reverse geocoding
  http: ^1.2.0

  # Storage slice — Supabase for cloud photo uploads
  supabase_flutter: ^2.5.0
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0
  sentry_flutter: ^9.0.0
  flutter_local_notifications: ^17.2.4
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/splash/
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: "assets/branding/icon.png"
  min_sdk_android: 21
  background_color_android: "#FFFFFF"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon.png"
flutter_native_splash:
  color: "#004AAD"
  background_image: assets/splash/opstation_splash.png
  fullscreen: true
  android: true
  ios: false
  android_12:
    color: "#004AAD"
